# Optional: activate the demo Python environment and put Bun on PATH first.
# Hooks inspect files; none apply unsafe fixes or call a real AI provider.
repos:
  - repo: local
    hooks:
      - id: repository-check
        name: private data and repository boundary
        entry: python scripts/check_repository.py --staged
        language: system
        pass_filenames: false
      - id: demo-ruff
        name: demo Python lint
        entry: python -m ruff check --target-version py313 backend/demo_ai
        language: system
        files: ^backend/demo_ai/.*\.py$
        pass_filenames: false
      - id: demo-ruff-format
        name: demo Python format
        entry: python -m ruff format --check --target-version py313 backend/demo_ai
        language: system
        files: ^backend/demo_ai/.*\.py$
        pass_filenames: false
      - id: demo-frontend
        name: demo frontend lint
        entry: bun run --filter frontend check:demo
        language: system
        files: ^frontend/
        pass_filenames: false
