const geometries={

 box:new THREE.BoxGeometry(1,1,1),
 cylinder:new THREE.CylinderGeometry(.5,.5,1,10),
 cone:new THREE.ConeGeometry(.5,1,9),
 icosa:new THREE.IcosahedronGeometry(1,1),
 torus:new THREE.TorusGeometry(1,.12,6,24)
};
const modelMaterials=new Map();
function modelMaterial(color,roughness=.82){
 const key=color+'_'+roughness;
 if(!modelMaterials.has(key))modelMaterials.set(key,new THREE.MeshStandardMaterial({color,roughness,metalness:0,flatShading:false}));
 return modelMaterials.get(key);
}
function piece(group,kind,color,xyz,scale,roughness=.82){
 const m=new THREE.Mesh(geometries[kind],modelMaterial(color,roughness));
 m.position.set(...xyz);m.scale.set(...scale);m.castShadow=Math.max(...scale)>.16;m.receiveShadow=true;
 group.add(m);return m;
}
function curveTube(group,color,points,r=.018){
 const path=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)));
 const m=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(8,points.length*5),r,6,false),modelMaterial(color));
 m.castShadow=false;group.add(m);return m;
}
function segment(group,color,a,b,r=.02){
 const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b),vec=vb.clone().sub(va);
 const m=piece(group,'cylinder',color,va.add(vb).multiplyScalar(.5).toArray(),[r*2,vec.length(),r*2]);
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vec.normalize());return m;
}
function shaped(group,geometry,color,x,y,z){
 const m=new THREE.Mesh(geometry,modelMaterial(color));m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}

// V15 溪流：独立可移动的弯曲河道。河床、岸坡、水面和细波纹均为真实 3D 几何体。
// 使用少量合并网格绘制曲面，避免大量小草针状物；河道整体跟随沙具缩放、旋转和保存。
function buildCreek(group){
 const centerPoints=[
  [-1.21,-.69],[-1.02,-.54],[-.75,-.23],[-.47,-.16],
  [-.18,-.29],[.13,-.16],[.37,.14],[.61,.24],[.89,.42],[1.20,.70]
 ];
 const curve=new THREE.CatmullRomCurve3(centerPoints.map(([x,z])=>new THREE.Vector3(x,0,z)),false,'centripetal');
 const steps=64,across=8;
 // 曲线中心线 -> 左右河岸，按远近与弯曲程度轻微改变宽度。
 function positionAt(t,edge,y,halfWidth,layer){
  const center=curve.getPoint(t),tangent=curve.getTangent(t).normalize();
  const nx=-tangent.z,nz=tangent.x;
  const endFade=.68+.32*THREE.MathUtils.smoothstep(t,0,.09)*(1-THREE.MathUtils.smoothstep(t,.91,1));
  const width=halfWidth*(.94+.09*Math.sin(t*Math.PI*4.1+layer*.7)+.045*Math.sin(t*39+layer))*endFade;
  return new THREE.Vector3(center.x+nx*edge*width,y,center.z+nz*edge*width);
 }
 function ribbon(halfWidth,y,colors,opts={}){
  const vertices=[],rgb=[],uv=[],faces=[];
  const material=new THREE.MeshStandardMaterial({
   vertexColors:true,roughness:opts.roughness??.94,metalness:opts.metalness??0,
   side:THREE.DoubleSide,transparent:!!opts.transparent,opacity:opts.opacity??1,
   depthWrite:!opts.transparent
  });
  for(let i=0;i<=steps;i++){
   const t=i/steps;
   for(let j=0;j<=across;j++){
    const k=j/across,side=k*2-1;
    const pos=positionAt(t,side,y,halfWidth,opts.layer||0);
    // 两岸边缘只有很小的起伏，水面保持平整。
    pos.y+=(opts.bank? .009*Math.sin(21*t+side*9)+.004*Math.cos(65*t+side*11):0);
    vertices.push(pos.x,pos.y,pos.z);uv.push(t*3,k);
    const ix=k*(colors.length-1),ii=Math.min(colors.length-2,Math.floor(ix)),fr=ix-ii;
    const col=new THREE.Color(colors[ii]).lerp(new THREE.Color(colors[ii+1]),fr);
    col.multiplyScalar(.97+.06*Math.sin(16*t+side*6)+.018*Math.sin(57*t));
    rgb.push(col.r,col.g,col.b);
   }
  }
  for(let i=0;i<steps;i++)for(let j=0;j<across;j++){
   const a=i*(across+1)+j,b=(i+1)*(across+1)+j;
   faces.push(a,a+1,b,b,a+1,b+1);
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geometry.setAttribute('color',new THREE.Float32BufferAttribute(rgb,3));
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geometry.setIndex(faces);geometry.computeVertexNormals();
  const item=new THREE.Mesh(geometry,material);item.castShadow=false;item.receiveShadow=true;
  item.renderOrder=opts.order||0;group.add(item);return item;
 }
 // 泥砂过渡岸：从外缘的浅绿灰过渡到浅沙色，避免水面像直接粘在草坪上。
 ribbon(.45,.012,['#a7b39a','#b0ad91','#cebfa2','#dfcfaf','#e3d3b5','#cfbaa0','#ada891','#9fae9b'],{bank:true,layer:1,order:1});
 // 水体深浅：边缘清浅，中央偏青绿；多段横向渐变比纯蓝色平面柔和。
 ribbon(.315,.041,['#c4d6c4','#a8cccb','#7fbabd','#629fae','#5e9eac','#84bec0','#a9d0c9','#c3d8c9'],{roughness:.38,layer:2,order:2});
 // 中央缓慢流动的较深水道，不使用不自然的硬边或镜面高光。
 ribbon(.205,.047,['#7faeb3','#72aab5','#649eae','#568fa3','#6098a8','#74b2b7','#8bc0c0','#9ccaca'],{roughness:.42,layer:3,opacity:.78,transparent:true,order:3});
 // 独立制作小段横向弧线波纹，不重复贴“大白椭圆”。
 const ripples=[];
 for(let n=0;n<9;n++){
  const t=.09+n*.095;
  const tangent=curve.getTangent(t).normalize(),normal=new THREE.Vector3(-tangent.z,0,tangent.x);
  const c=curve.getPoint(t),side=(n%3-1)*.065;
  const w=.065+(n%3)*.019,pts=[];
  for(let j=0;j<=6;j++){
   const a=j/6*2-1;
   pts.push(new THREE.Vector3(c.x+normal.x*(side+a*w)+tangent.x*(.018*(1-a*a)),
    .070,c.z+normal.z*(side+a*w)+tangent.z*(.018*(1-a*a))));
  }
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),10,.0065,4,false),
   new THREE.MeshBasicMaterial({color:'#e9f5e8',transparent:true,opacity:.35,depthWrite:false}));
  m.castShadow=false;m.renderOrder=5;m.userData.phase=n*.89;group.add(m);ripples.push(m);
 }
 // 两岸卵石、小片苔草：数量受控，贴地且比例与沙具一致。
 const rockPalette=['#c9c5af','#b8b8ab','#a6aea1','#d4c7ae','#98aa9d'];
 const rockGeo=new THREE.IcosahedronGeometry(1,1);
 for(let n=0;n<26;n++){
  const t=.055+(n/25)*.88,side=n%2?1:-1;
  const p=positionAt(t,side,.035,.382,1);
  const size=.045+(n%5)*.011;
  const rock=new THREE.Mesh(rockGeo,modelMaterial(rockPalette[n%rockPalette.length]));
  rock.scale.set(size*(1+n%3*.16),size*.34,size*(.65+n%4*.12));
  rock.position.set(p.x,.038+size*.15,p.z);
  rock.rotation.y=n*2.1;rock.castShadow=false;rock.receiveShadow=true;group.add(rock);
 }
 for(let n=0;n<12;n++){
  const t=.10+(n/11)*.78,side=n%2?1:-1;
  const loc=positionAt(t,side,.030,.48,1);
  const plant=new THREE.Mesh(new THREE.SphereGeometry(1,8,5),modelMaterial(n%3===0?'#9eae85':'#85a480'));
  plant.position.set(loc.x,.048,loc.z);plant.scale.set(.075,.025,.060);
  plant.castShadow=false;group.add(plant);
 }
 // 统一由父沙具组提供波纹数据，保存/恢复只依赖既有 type/scale/position 字段。
 group.userData.creekRipples=ripples;
}

 if((e.key==='q'||e.key==='Q'||e.key==='e'||e.key==='E')&&selected){selected.rotation.y+=(e.key.toLowerCase()==='q'?-1:1)*Math.PI/8;constrainObject(selected);choose(selected);}
});
window.addEventListener('resize',fitCamera);
setTheme('meadow');setCameraView('isometric');demo();renderUI();document.getElementById('loading').remove();
const clock=new THREE.Clock();
let creekTime=0;
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.08);creekTime+=dt;
 for(const o of objects){
  const prop=o.userData.propeller;if(prop)prop.rotation.z+=dt*.26;
  const ripples=o.userData.creekRipples;
  if(ripples)for(const wave of ripples){
   wave.material.opacity=.28+.14*(.5+.5*Math.sin(creekTime*1.55+wave.userData.phase));
  }
 }
 controls.update();renderer.render(scene,camera);
}tick();

// MIND_ISLAND_BRIDGE_START
import { installSandplayBridge } from './sandplay-bridge.js';
installSandplayBridge({
 types: defs.map(d=>d.id), serialize,
 clear(){objects.forEach(o=>scene.remove(o));objects=[];choose(null);},
 load(data){
  objects.forEach(o=>scene.remove(o));objects=[];choose(null);
  document.getElementById('trayWidth').value=data.tray.width;
  document.getElementById('trayDepth').value=data.tray.depth;
  updateTray(data.tray.width,data.tray.depth);setTheme(data.theme);
  for(const item of data.objects){
   const o=add(item.type,item.x,item.z,true);
   o.rotation.y=item.rotation;o.scale.setScalar(item.scale);
   o.position.set(item.x,item.y,item.z);constrainObject(o);
  }
  choose(null);
 }
});
// MIND_ISLAND_BRIDGE_END
